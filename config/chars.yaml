# Character model config — stat coupling/decay/compliance + bond thresholds.
# Loaded over data/configDefaults.js. Reference: docs/config/chars.md.
# Note: the stat KEYS and bond tier ORDER are structural (code);
# only the numeric tuning below is editable.

startStats:                   # defaultStats() baseline (personas override per character)
  happiness: 50
  openness: 30
  dominance: 50
  trust: 20
  tension: 25
  energy: 75
  sobriety: 100
  loyalty: 10
  fear: 5

coupling:                     # cross-stat gain modifiers (stats.js couplingFactor)
  intoxOpen: 0.5              # intoxication amplifies openness gain
  fearClose: 0.4              # fear suppresses openness gain
  tensionTrust: 0.4           # tension suppresses trust gain
  fearTension: 0.35           # fear amplifies tension gain

decay:                        # passive homeostatic regression (decayTick)
  rest: { tension: 22, fear: 4 }   # rest targets
  rate: { tension: 0.25, fear: 0.4 } # per-minute fall
  approachFactor: 0.3         # rise-toward-rest is this fraction of the fall rate
  sobrietyRegain: 0.35        # sobriety per minute

compliance:                   # compliance() weights (0..1) + dominance clash
  trust: 0.30
  openness: 0.22
  happiness: 0.14
  loyalty: 0.14
  calm: 0.12                  # weight on (100 - tension)
  brave: 0.08                 # weight on (100 - fear)
  clashScale: 0.35            # per point of (npc dominance - player dominance)
  clashMin: -20
  clashMax: 35

bond:                         # relationship tier on (trust + loyalty) / 2 (src/chars/bond.js)
  thresholds: { ally: 35, trusted: 55, loyal: 75 }
  hysteresis: 5               # a held tier survives until the score drops below entry - this
