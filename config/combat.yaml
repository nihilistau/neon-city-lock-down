# Combat config — weapons, hostile archetypes, magazines, cover, turret.
# Loaded at boot over data/configDefaults.js. Reference: docs/config/combat.md.

weapons:                  # damage [min,max], accuracy 0..1 at close range, range = m where accuracy halves
  sidearm: { id: sidearm, damage: [12, 22], accuracy: 0.78, range: 9 }
  smg:     { id: smg,     damage: [8, 14],  accuracy: 0.6,  range: 7 }
  pipe:    { id: pipe,    damage: [6, 12],  accuracy: 0.85, range: 1.2 }
  shiv:    { id: shiv,    damage: [5, 10],  accuracy: 0.8,  range: 1 }

hostileArchetypes:        # hp, skill 0..100, weapon key, move speed, aggression 0..1
  rioter: { hp: 45, skill: 30, weapon: pipe, speed: 1.5, aggression: 0.8 }
  looter: { hp: 35, skill: 25, weapon: shiv, speed: 1.7, aggression: 0.5 }
  merc:   { hp: 70, skill: 65, weapon: smg,  speed: 1.3, aggression: 0.95 }

magSize: { sidearm: 12, smg: 25, pipe: 1, shiv: 1 }   # rounds before reload

turretPeriod: 2.6         # seconds between automated turret shots
waveDelay: 6              # seconds between breach waves

cover:
  minTop: 0.5             # min furniture height (m) to count as cover
  maxTop: 1.45            # height at which cover quality saturates
  nearM: 2.2             # must be within this distance to use a cover spot
  tallAt: 0.9             # furniture at/above this height gives tall-cover quality
  qualityTall: 0.65       # cover quality for tall furniture (top ≥ tallAt)
  qualityLow: 0.4         # cover quality otherwise
  maxRange: 14            # max search range for a cover spot
  offset: 0.55            # stand-off distance behind cover
